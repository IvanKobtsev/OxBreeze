name: Build release plugin

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Test and build plugin
        run: .\gradlew.bat --no-daemon test buildPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: OxBreeze-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Attach plugin to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $artifacts = @(Get-ChildItem -Path build/distributions/*.zip -File | ForEach-Object { $_.FullName })
          if ($artifacts.Count -eq 0) { throw 'No plugin ZIP found' }
          gh release upload "$env:RELEASE_TAG" @artifacts --clobber
